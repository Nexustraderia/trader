services:
  - type: web
    name: nexus-ia-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: BOT_MODE
        value: TESTE
      - key: TELEGRAM_CHANNEL_ID
        value: '@NexusTraderIA'
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: IQ_OPTION_EMAIL
        sync: false
      - key: IQ_OPTION_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bancodedadostrader
          property: connectionString
