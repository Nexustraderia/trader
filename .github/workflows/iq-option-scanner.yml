name: IQ Option paper scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: iq-option-paper-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IQ_OPTION_EMAIL: ${{ secrets.IQ_OPTION_EMAIL }}
      IQ_OPTION_PASSWORD: ${{ secrets.IQ_OPTION_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: "@NexusTraderIA"
      PYTHONPATH: .
      AUTO_SIGNAL_MIN_CONFIDENCE: "80"
      MAX_SCAN_ASSETS: "12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Scan IQ Option and publish paper signals
        run: python tools/github_scanner.py
