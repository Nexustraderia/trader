name: IQ Option paper scanner

on:
  schedule:
    # GitHub's minimum supported cron interval is five minutes.
    - cron: "*/5 * * * *"
  # Keep manual dispatch available for diagnostics.
  workflow_dispatch:

concurrency:
  group: iq-option-paper-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      IQ_OPTION_EMAIL: ${{ secrets.IQ_OPTION_EMAIL }}
      IQ_OPTION_PASSWORD: ${{ secrets.IQ_OPTION_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: "@NexusTraderIA"
      PYTHONPATH: .
      AUTO_SIGNAL_MIN_CONFIDENCE: "85"
      OTC_ONLY: "false"
      SESSION_STAKE: "2.00"
      SESSION_PAYOUT_PERCENT: "90"
      MAX_SCAN_ASSETS: "27"
      SIGNAL_TIMEFRAME: "1m"
      SESSION_SIZE: "25"
      PUT_MIN_CONFIDENCE: "80"
      OTC_FALLBACK_MIN_CONFIDENCE: "85"
      OTC_STRONG_TREND_ADX: "25"
      QUARANTINE_MIN_SAMPLES: "8"
      QUARANTINE_MAX_ACCURACY: "45"
      QUARANTINE_CYCLES: "20"
      INTERNAL_CYCLES: "4"
      INTERNAL_CYCLE_SLEEP_SECONDS: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Scan IQ Option and publish paper signals
        run: |
          git config user.name "nexus-ia-trader[bot]"
          git config user.email "nexus-ia-trader[bot]@users.noreply.github.com"

          persist_state() {
            cp runtime_state.json /tmp/runtime_state.local.json
            git add runtime_state.json
            if git diff --cached --quiet; then
              echo "No state changes to commit"
              return 0
            fi
            git commit -m "chore: persist paper trading state"
            # Publish immediately after this one-minute cycle. A short retry
            # protects the state commit if a queued scheduled run advanced main.
            for attempt in 1 2 3; do
              if git push; then
                return 0
              fi
              echo "Push retry $attempt: rebasing on origin/main"
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              python - <<'PY'
import json
from pathlib import Path

local_path = Path('/tmp/runtime_state.local.json')
remote_path = Path('runtime_state.json')
local = json.loads(local_path.read_text())
remote = json.loads(remote_path.read_text())

def merge_rows(name):
    rows = []
    seen = set()
    for item in remote.get(name, []) + local.get(name, []):
        key = (
            item.get('symbol'), item.get('entry_at'),
            int(item.get('martingale_level') or 0), item.get('outcome'),
        )
        if key not in seen:
            seen.add(key)
            rows.append(item)
    return rows[-100:] if name == 'settled' else rows

merged = dict(remote)
for bucket in ('pending', 'settled', 'session_results'):
    merged[bucket] = merge_rows(bucket)
merged['completed_sessions'] = max(
    int(remote.get('completed_sessions', 0)),
    int(local.get('completed_sessions', 0)),
)
merged['asset_quarantine'] = {**remote.get('asset_quarantine', {}), **local.get('asset_quarantine', {})}
remote_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\\n')
PY
              git add runtime_state.json
              if git diff --cached --quiet; then
                echo "Remote state already contains this cycle"
              else
                git commit -m "chore: merge paper trading state after push race"
              fi
            done
            echo "Could not publish runtime_state.json after three attempts"
            return 1
          }

          for cycle in $(seq 1 "$INTERNAL_CYCLES"); do
            echo "INTERNAL_CYCLE=$cycle/$INTERNAL_CYCLES"
            python tools/github_scanner.py
            persist_state
            if [ "$cycle" -lt "$INTERNAL_CYCLES" ]; then
              sleep "$INTERNAL_CYCLE_SLEEP_SECONDS"
            fi
          done
